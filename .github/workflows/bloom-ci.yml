name: Bloom Studio - validação isolada

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bloom_qa_db
          POSTGRES_USER: bloom_qa
          POSTGRES_PASSWORD: bloom_qa_isolated_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloom_qa -d bloom_qa_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://bloom_qa:bloom_qa_isolated_2026@127.0.0.1:5432/bloom_qa_db?schema=public
      JWT_SECRET: ci-sandbox-only-a-strong-enough-fixed-secret-2026
      BLOOM_QA_BASE_URL: http://127.0.0.1:3101
      BLOOM_DEMO_ENABLED: "false"
      NEXT_PUBLIC_BLOOM_DEMO_ENABLED: "false"

    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9e

        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Gerar banco somente de QA
        run: |
          bunx prisma db push --skip-generate
          bunx prisma generate

      - name: Checar TypeScript
        run: bunx tsc --noEmit --incremental false

      - name: Build Next.js
        run: bun run build

      - name: Testes de autenticação, isolamento e recuperação
        run: |
          ./node_modules/.bin/next dev -p 3101 > /tmp/bloom-ci.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3101/api/auth/me >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Bloom Studio não iniciou"
            tail -n 60 /tmp/bloom-ci.log
            exit 1
          fi
          node tests/qa-flora.cjs
